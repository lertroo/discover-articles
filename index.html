<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discover Articles</title>
<meta name="description" content="地図上で近くの記事を探す">
<meta name="theme-color" content="#2b6cb0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
<script>
  (() => {
    if (location.hostname !== 'lertroo.github.io' || !navigator.sendBeacon) return;
    try {
      navigator.sendBeacon('https://access-log.lertroo.workers.dev/hit', JSON.stringify({
        site: 'discover-articles', path: location.pathname, query: location.search, title: document.title,
        ref: document.referrer, lang: navigator.language,
        screen: screen.width + 'x' + screen.height, viewport: innerWidth + 'x' + innerHeight,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }));
    } catch {}
  })();
</script>
</head>
<body>
<header class="bar">
  <h1 class="title">Discover Articles</h1>
  <span id="status" class="status" aria-live="polite"></span>
  <button id="btn-search" class="btn" type="button" title="住所で探す" aria-expanded="false" aria-controls="search">検索</button>
  <button id="btn-locate" class="btn" type="button" title="現在地へ移動">現在地</button>
  <button id="btn-menu" class="btn" type="button" title="設定" aria-expanded="false" aria-controls="menu">設定</button>
</header>
<div id="menu" class="menu" hidden>
  <div class="row">
    <span class="label">文字サイズ</span>
    <div class="seg" id="font-seg">
      <button type="button" data-font="s">小</button>
      <button type="button" data-font="m">中</button>
      <button type="button" data-font="l">大</button>
    </div>
  </div>
  <div class="row">
    <span class="label">表示</span>
    <div class="seg" id="theme-seg">
      <button type="button" data-theme="light">ライト</button>
      <button type="button" data-theme="dark">ダーク</button>
    </div>
  </div>
  <div class="row">
    <span class="label">保存先</span>
    <select id="bm-target" class="select" aria-label="ブックマークの保存先"></select>
  </div>
  <div class="row">
    <span class="label">リスト</span>
    <span class="btns">
      <button id="btn-bm-new" class="btn small" type="button">新規</button>
      <button id="btn-bm-rename" class="btn small" type="button">名前変更</button>
      <button id="btn-bm-del" class="btn small" type="button">削除</button>
    </span>
  </div>
  <div class="row">
    <span class="label">既読</span>
    <button id="btn-clear-read" class="btn small" type="button">既読記録を消去</button>
  </div>
</div>
<form id="search" class="search" role="search" hidden>
  <input id="search-q" class="search-q" type="search" placeholder="住所・地名（例：京都市左京区）" enterkeyhint="search" autocomplete="off" aria-label="住所・地名">
  <button class="btn" type="submit">探す</button>
  <ul id="search-results" class="results" hidden></ul>
</form>
<div class="main">
  <aside id="panel" class="panel" hidden aria-label="記事">
    <button id="panel-close" class="close" type="button" aria-label="閉じる">×</button>
    <div id="panel-body"></div>
  </aside>
  <main id="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
